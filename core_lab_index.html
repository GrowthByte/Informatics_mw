<!DOCTYPE html>
<html lang="ko">
<!-- Pixel Diner 완전학습판 · 최종본 (2026-09-02) — 팀원 원본 기반 + 버그 수정 4건 + UX 개선(append 연출·재고 배지·칩 규칙·문구) + 퀴즈-학습카드 정합성 전수 정리 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#58CC02">
<title>Pixel Diner — 리스트 · 2차원 · 함수</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
    --green:#58CC02; --green-d:#4CAF00; --green-l:#D7FFB8;
    --blue:#1CB0F6; --blue-d:#1899D6; --blue-l:#DDF4FF;
    --gold:#FFC800; --gold-d:#E6A100;
    --red:#FF4B4B; --red-d:#E63946;
    --orange:#FF9600;
    --purple:#B15CFF; --purple-d:#8B2FD6; --purple-l:#F0DEFF;
    --grey:#E5E5E5; --grey-d:#C4C4C4; --greytext:#AFAFAF;
    --ink:#4B4B4B; --bg:#FFFFFF; --panel:#F7F7F7;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Fredoka',sans-serif;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27260%27%20height%3D%27260%27%3E%3Cg%20font-size%3D%2730%27%20opacity%3D%270.07%27%3E%3Ctext%20x%3D%2720%27%20y%3D%2750%27%20transform%3D%27rotate%28-12%2020%2050%29%27%3E%F0%9F%8D%94%3C/text%3E%3Ctext%20x%3D%27150%27%20y%3D%2740%27%20transform%3D%27rotate%2810%20150%2040%29%27%3E%F0%9F%8D%9F%3C/text%3E%3Ctext%20x%3D%2780%27%20y%3D%27140%27%20transform%3D%27rotate%28-8%2080%20140%29%27%3E%F0%9F%A5%A4%3C/text%3E%3Ctext%20x%3D%27190%27%20y%3D%27170%27%20transform%3D%27rotate%2814%20190%20170%29%27%3E%F0%9F%A7%80%3C/text%3E%3Ctext%20x%3D%2730%27%20y%3D%27225%27%20transform%3D%27rotate%288%2030%20225%29%27%3E%F0%9F%8D%85%3C/text%3E%3Ctext%20x%3D%27150%27%20y%3D%27245%27%20transform%3D%27rotate%28-10%20150%20245%29%27%3E%F0%9F%A5%AC%3C/text%3E%3C/g%3E%3C/svg%3E"), linear-gradient(180deg,#FFFDF4 0%,#F2F8FF 100%);background-attachment:fixed;color:var(--ink);
    user-select:none;-webkit-tap-highlight-color:transparent;min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:720px;margin:0 auto;padding:12px;}
button{font-family:inherit;}

.topbar{display:flex;align-items:center;justify-content:space-between;
    padding:10px 6px;border-bottom:2px solid var(--grey);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);z-index:20;}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green);font-size:20px;}

.btn{border:none;border-radius:16px;font-weight:700;font-size:17px;
    letter-spacing:.5px;color:#fff;cursor:pointer;padding:14px 22px;text-transform:uppercase;
    box-shadow:0 5px 0 var(--green-d);transition:all .08s;background:var(--green);}
.btn:active{transform:translateY(5px);box-shadow:0 0 0;}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d);}
.btn.grey{background:var(--grey);color:var(--greytext);box-shadow:0 5px 0 var(--grey-d);cursor:default;}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d);}
.btn.gold{background:var(--gold);color:#7a5b00;box-shadow:0 5px 0 var(--gold-d);}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d);}
.btn:disabled{background:var(--grey);color:var(--greytext);box-shadow:0 5px 0 var(--grey-d);cursor:default;}
.btn.sm{font-size:14px;padding:10px 16px;border-radius:13px;}

/* ---------- 맵 ---------- */
.path{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 40px;position:relative;}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
.node{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:14px;
    color:#fff;transition:all .1s;position:relative;border:none;}
.node .big{font-size:34px;line-height:1;}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d);color:#7a5b00;}
.node.current{background:var(--green);box-shadow:0 8px 0 var(--green-d);animation:bob 1s infinite alternate;}
.node.locked{background:var(--grey);box-shadow:0 8px 0 var(--grey-d);color:var(--greytext);cursor:not-allowed;}
.node:active:not(.locked){transform:translateY(8px);box-shadow:0 0 0;}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-8px);}}
.node-label{font-size:13px;font-weight:700;color:var(--ink);text-align:center;}
.node-label .sub{font-weight:600;color:var(--greytext);font-size:11px;margin-top:2px;}
.node.stage{width:118px;height:118px;font-size:14px;}
.node.stage .big{font-size:40px;}
.node.stage.open{background:var(--green);box-shadow:0 8px 0 var(--green-d);color:#fff;}
.node.stage.cleared{background:var(--gold);box-shadow:0 8px 0 var(--gold-d);color:#7a5b00;}
.stage-stars{font-size:14px;letter-spacing:2px;margin-top:2px;}
.node.small{width:60px;height:60px;font-size:11px;}
.node.small .star-face{font-size:24px;line-height:1;}
.node.small.current{background:var(--purple);box-shadow:0 6px 0 var(--purple-d);}
.node.small.done{background:var(--purple-l);box-shadow:0 6px 0 #c9a6ea;color:var(--purple-d);}
.node.check{width:72px;height:72px;}
.node.check .big{font-size:30px;}
.node.check.current{background:var(--blue);box-shadow:0 8px 0 var(--blue-d);}
.node.check.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d);color:#7a5b00;}
.node-stars{font-size:15px;letter-spacing:2px;}
.connector{width:6px;height:14px;background:repeating-linear-gradient(var(--grey-d) 0 5px,transparent 5px 10px);border-radius:3px;}
.start-bubble{position:absolute;top:-40px;background:#fff;border:2px solid var(--grey);border-radius:14px;
    padding:5px 12px;font-weight:700;color:var(--green);font-size:13px;box-shadow:0 3px 0 var(--grey);white-space:nowrap;
    animation:bob 1s infinite alternate;z-index:2;}
.start-bubble::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid #fff;}
.sect{width:100%;display:flex;align-items:center;gap:10px;margin:16px 0 4px;}
.sect .line{flex:1;height:2px;background:var(--grey);border-radius:2px;}
.sect .tag{font-weight:700;font-size:12px;color:var(--greytext);letter-spacing:1px;}

/* ---------- 게임 ---------- */
#game-screen,#learn-screen,#quiz-screen{display:none;}
.game-top{display:flex;align-items:center;gap:12px;padding:10px 4px;}
.xbtn{font-size:26px;color:var(--greytext);background:none;border:none;cursor:pointer;font-weight:700;}
.gauge-outer{flex:1;height:22px;background:var(--grey);border-radius:12px;overflow:hidden;position:relative;}
.gauge-inner{height:100%;width:100%;border-radius:12px;background:var(--green);transition:width .05s linear;}
.gauge-inner.warn{background:var(--orange);}
.gauge-inner.danger{background:var(--red);animation:gpulse .4s infinite alternate;}
@keyframes gpulse{from{opacity:.7;}to{opacity:1;}}
.gauge-time{position:absolute;right:10px;top:2px;font-weight:700;color:#fff;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.hearts{font-size:20px;letter-spacing:1px;}
.lvl-row{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px;font-weight:700;flex-wrap:wrap;gap:6px;}
.lvl-tag{background:var(--gold);color:#7a5b00;border-radius:10px;padding:3px 10px;font-size:14px;}
.prog-dots{font-size:18px;letter-spacing:3px;color:var(--green);}
.combo-badge{background:#FFE3C2;color:var(--orange);border-radius:10px;padding:3px 10px;font-size:14px;font-weight:700;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.confetti-piece{position:absolute;top:-32px;animation:fall 1.9s linear forwards;}
@keyframes fall{to{transform:translateY(112vh) rotate(400deg);opacity:.85;}}

.need-card{background:var(--panel);border:2px solid var(--grey);border-radius:18px;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.need-big{font-size:28px;font-weight:700;display:flex;align-items:center;gap:10px;}
.echo{font-family:'JetBrains Mono',monospace;color:var(--green-d);font-size:14px;min-height:20px;}
.codeline{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#2B2B33;color:#F0EDE4;
    border-radius:12px;padding:9px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;}
.codeline .k{color:#7ED321;} .codeline .s{color:#FFD93B;} .codeline .c{color:#8C8B85;} .codeline .n{color:#FF9C6B;}

.belt-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin:0 2px 8px;}
.belt{display:grid;gap:8px;background:#F0F4F8;border:2px solid var(--grey);border-radius:18px;padding:12px;}
.slot{background:#fff;border:2px solid var(--grey);border-radius:14px;padding:8px 2px;display:flex;
    flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .08s;position:relative;}
.slot:hover{transform:translateY(-4px);border-color:var(--blue);}
.slot:active{transform:translateY(0);}
.keycap{min-width:30px;height:30px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;display:flex;align-items:center;
    justify-content:center;box-shadow:0 3px 0 var(--blue-d);}
.slot .emoji{font-size:26px;}
.slot .nm{font-size:10px;color:var(--greytext);font-weight:600;}
.belt.locked{filter:grayscale(.8) brightness(.95);pointer-events:none;}
.lock-toast{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
    border-radius:18px;background:rgba(255,255,255,.55);}
.lock-toast.show{display:flex;}
.lock-toast span{background:var(--red);color:#fff;font-weight:700;padding:9px 18px;border-radius:12px;
    box-shadow:0 4px 0 var(--red-d);font-size:15px;animation:pop .2s;}
.slot.empty{opacity:.4;cursor:default;border-style:dashed;background:#F7FAFC;}
.slot.empty:hover{transform:none;border-color:var(--grey);}
.slot.empty .keycap{background:var(--grey-d);box-shadow:0 3px 0 var(--greytext);}
.slot.correct{animation:sc-ok .4s;}
.slot.wrong{animation:sc-bad .4s;}
@keyframes sc-ok{0%{background:var(--green-l);border-color:var(--green);transform:scale(1.1);}100%{}}
@keyframes sc-bad{0%,60%{background:#FFE0E0;border-color:var(--red);}15%{transform:translateX(-6px);}45%{transform:translateX(6px);}100%{}}
@keyframes pop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.stockbadge{position:absolute;top:-10px;right:-6px;font-size:11px;
    font-weight:700;border-radius:9px;padding:2px 7px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap;
    background:#fff;border:1.5px solid var(--grey-d);color:var(--ink);}
/* append 직관화: 재료가 코드줄로 날아가고, 방금 추가분이 반짝 */
.fly-emoji{position:fixed;z-index:70;font-size:26px;pointer-events:none;
    transition:transform .55s cubic-bezier(.5,.9,.4,1),opacity .55s;will-change:transform;}
.codeline .just{background:rgba(126,211,33,.28);border-radius:6px;padding:0 3px;
    display:inline-block;animation:justpop .5s;}
@keyframes justpop{0%{transform:scale(1.7);background:rgba(126,211,33,.7);}100%{}}
.append-chip{display:inline-block;margin-left:10px;font-size:11.5px;color:#7ED321;font-weight:700;
    animation:chipfade 1.6s forwards;}
@keyframes chipfade{0%{opacity:0;transform:translateY(5px);}15%{opacity:1;transform:translateY(0);}75%{opacity:1;}100%{opacity:0;}}
.rowtag{display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:13px;color:var(--purple-d);background:var(--purple-l);border-radius:10px;}

/* 명령 칩 (반복) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
.chip{border:2px solid var(--grey);background:#fff;border-radius:13px;padding:7px 13px;font-weight:700;
    font-size:14px;cursor:pointer;transition:all .08s;box-shadow:0 3px 0 var(--grey);color:var(--ink);}
.chip:active{transform:translateY(3px);box-shadow:0 0 0;}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple-d);box-shadow:0 3px 0 var(--purple-d);}
.chip.param{background:var(--gold);color:#7a5b00;border-color:var(--gold-d);box-shadow:0 3px 0 var(--gold-d);}

.game-body{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
.recipe-box{flex:0 0 210px;background:#FFF8E7;border:3px solid var(--gold);border-radius:20px;
    padding:14px 14px 10px;box-shadow:0 5px 0 var(--gold-d);}
.recipe-head{font-weight:700;color:#8a6600;font-size:16px;display:flex;flex-direction:column;}
.recipe-head small{font-weight:600;color:#b58a2e;font-size:11px;margin-top:2px;}
.recipe-stack{display:flex;flex-direction:column-reverse;gap:5px;margin-top:12px;}
.rlayer{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:12px;border:2px solid;
    font-weight:700;font-size:13.5px;transition:all .12s;}
.rlayer .rl-emoji{font-size:20px;}
.rlayer .rl-name{flex:1;}
.rlayer.future{background:#fff;border-color:var(--grey);color:var(--greytext);opacity:.6;}
.rlayer.done{background:var(--green-l);border-color:var(--green);color:var(--green-d);}
.rlayer.cur{background:#FFEFB0;border-color:var(--gold);color:#7a5b00;animation:rpulse .8s infinite alternate;}
@keyframes rpulse{from{box-shadow:0 0 0 0 rgba(255,200,0,.55);}to{box-shadow:0 0 0 8px rgba(255,200,0,0);}}
.now-chip{background:var(--gold);color:#fff;border-radius:8px;padding:2px 7px;font-size:11px;}
.ok-chip{color:var(--green);font-size:15px;}
.idx-chip{color:var(--greytext);font-family:'JetBrains Mono',monospace;font-size:11px;}
.rplate{height:10px;background:linear-gradient(#e9e2cf,#cdbf9a);border-radius:0 0 14px 14px;margin-top:8px;}
.action-col{flex:1;min-width:290px;}

/* ---------- 주방 무대 (함수 스테이지) ---------- */
.kitchen{position:relative;height:235px;border-radius:18px;overflow:hidden;margin-bottom:10px;display:none;
    border:3px solid #C89B62;box-shadow:0 4px 0 #A87C4A;
    background:repeating-linear-gradient(45deg,rgba(120,70,20,.05) 0 3px,transparent 3px 26px),linear-gradient(#F7DCAB,#EFC98C);}
.counterrow{position:absolute;bottom:0;left:0;right:0;height:24px;background:#58B5AD;border-top:4px solid #3E8F88;}
.passtile{position:absolute;bottom:0;right:0;width:130px;height:32px;background:#7FCDC6;border-top:4px solid #3E8F88;border-left:4px solid #3E8F88;border-radius:8px 0 0 0;}
.station{position:absolute;bottom:12px;width:84px;text-align:center;transition:transform .6s cubic-bezier(.4,.7,.4,1),bottom .6s;z-index:5;cursor:pointer;}
.station.compact{width:58px;}
.station.compact .chefE{font-size:29px;}
.station.compact .chefnm{font-size:9px;}
.station.compact .keycap{width:22px !important;height:22px !important;font-size:12px !important;}
.station.back{z-index:3;filter:brightness(.95);}
.backrow{position:absolute;left:0;right:0;bottom:78px;height:18px;background:#58B5AD;border-top:4px solid #3E8F88;display:none;}
.chefE{font-size:37px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));display:inline-block;}
.station.cooking .chefE{animation:cookbounce .32s infinite alternate;}
@keyframes cookbounce{from{transform:translateY(0) rotate(-5deg);}to{transform:translateY(-8px) rotate(6deg);}}
.kbubble{display:none;position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:#fff;
    border:2px solid #E2C89A;border-radius:12px;padding:3px 9px;font-size:15px;white-space:nowrap;
    box-shadow:0 3px 0 rgba(0,0,0,.12);z-index:6;}
.kbubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #fff;}
.chefnm{font-size:11px;font-weight:700;color:#6B4A2B;background:rgba(255,255,255,.8);border-radius:8px;margin-top:2px;padding:1px 2px;}
.mainchef{position:absolute;bottom:12px;right:22px;text-align:center;z-index:5;}
.passfood{position:absolute;bottom:34px;right:112px;font-size:19px;letter-spacing:-3px;z-index:4;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));}
.kdeco{position:absolute;font-size:21px;pointer-events:none;}

/* ---------- 레스토랑 홀 (서빙 스테이지) ---------- */
.passzone{background:linear-gradient(#FFF6E3,#F7E3BC);border:3px solid #D9B98A;border-radius:16px;padding:10px;box-shadow:0 4px 0 #C7A570;margin-bottom:12px;}
.hallzone{background:repeating-linear-gradient(90deg,#E5BC83 0 36px,#DCAF72 36px 72px);border:3px solid #B98A52;border-radius:16px;padding:12px;box-shadow:0 4px 0 #96693A, inset 0 0 34px rgba(110,60,15,.18);}
.tbl{background:linear-gradient(#C08449,#A96F35);border:2.5px solid #8F5B2A;border-radius:14px;padding:6px 2px 7px;cursor:pointer;text-align:center;transition:transform .08s;box-shadow:0 3px 0 #7A4A1E;position:relative;}
.order-bub{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--gold);border-radius:12px;padding:2px 9px;font-size:13.5px;font-weight:700;color:#7a5b00;white-space:nowrap;z-index:7;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:bob 1s infinite alternate;}
.order-bub::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #fff;}
.tbl.ordering{box-shadow:0 3px 0 #7A4A1E, 0 0 0 3px rgba(255,200,0,.55);}
.tbl.ordering .cust{animation:cookbounce .6s infinite alternate;}
.tbl:hover{transform:translateY(-3px);}
.tbl.servedT{cursor:default;filter:saturate(.9);}
.tbl .cust{font-size:21px;line-height:1.1;}
.tbl .cloth{width:36px;height:23px;background:#FFF8EC;border-radius:50%;margin:3px auto 0;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.18);}
.tbl .tcoord{font-size:10px;font-weight:700;color:#7A4E1F;background:#FFF3DC;border-radius:6px;display:inline-block;padding:0 5px;margin-top:4px;}
.tbl.correct{animation:sc-ok .4s;}
.tbl.wrong{animation:sc-bad .4s;}
.hallsign{background:#6B4A2B !important;color:#FFE9C2 !important;}
.walk-emoji{position:fixed;z-index:70;font-size:26px;line-height:1;text-align:center;pointer-events:none;
    transition:transform .8s cubic-bezier(.45,.6,.4,1);will-change:transform;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));}

/* ---------- 키보드 전용: 마우스 클릭 차단 ---------- */
/* 게임 플레이 중에만 마우스 차단 — 맵·학습카드·퀴즈는 마우스 허용 */
.kbonly #game-screen .slot, .kbonly #game-screen .tbl,
.kbonly #game-screen .station, .kbonly #game-screen .chip{pointer-events:none;}

/* ---------- 오버레이 ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;
    align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.sheet{background:#fff;border-radius:22px;padding:26px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.15);animation:pop .25s cubic-bezier(.34,1.56,.64,1);}
.sheet .icon{font-size:60px;}
.sheet h3{font-size:24px;margin:8px 0;}
.sheet .stars{font-size:36px;letter-spacing:6px;margin:8px 0;}
.sheet p{color:var(--greytext);font-weight:600;margin-bottom:16px;font-size:14px;}

        const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
        const n=actx.currentTime;
        if(t==='ok'){o.frequency.setValueAtTime(660,n);o.frequency.exponentialRampToValueAtTime(990,n+.08);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.01,n+.1);o.start(n);o.stop(n+.1);}
        else if(t==='bad'){o.type='sawtooth';o.frequency.setValueAtTime(200,n);o.frequency.exponentialRampToValueAtTime(120,n+.15);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.01,n+.2);o.start(n);o.stop(n+.2);}
        else if(t==='done'){o.type='triangle';[523,659,784,1046].forEach((f,i)=>o.frequency.setValueAtTime(f,n+i*.09));g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+.5);o.start(n);o.stop(n+.5);}
        else if(t==='star'){o.type='triangle';[784,1046,1318].forEach((f,i)=>o.frequency.setValueAtTime(f,n+i*.12));g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.01,n+.6);o.start(n);o.stop(n+.6);}

    }catch(e){}
}

function buildQuizSet(){
    const pool = retry ? ST().requiz : ST().quiz;
    let s = shuffled(pool).slice(0,5);
    if(!s.some(q=>q.type==='input')){
        const inp = pool.filter(q=>q.type==='input');
        if(inp.length) s[s.length-1] = pick(inp);
    }
    return shuffled(s);
}

function stopTimer(){ running=false; cancelAnimationFrame(tRAF); }
function tick(){
    if(!running) return;
    const left=Math.max(0,tDur-(performance.now()-tStart)), r=left/tDur, g=$('gauge');
    g.style.width=(r*100)+'%';
    g.className='gauge-inner'+(r<=.25?' danger':r<=.5?' warn':'');
    $('gauge-time').innerText=(left/1000).toFixed(1)+'s';
    if(left<=0){ stopTimer(); onTimeout(); return; }
    tRAF=requestAnimationFrame(tick);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const PY=/(#[^\n]*)|('[^'\n]*')|\b(def|return|for|while|if|else|elif|in|range|print|len|append|not|and|or)\b|\b(\d+)\b/g;
function hi(src){
    return esc(src).replace(PY,(m,c,s,k,n)=>
        c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:`<span class="n">${n}</span>`);
}

            html+=`<div class="node-wrap" style="transform:translateX(${off[k]}px)">${bub}

        });

function quitToMap(){ showMap(); }
const goalOf = () => ST().mode==='grid' ? curLevel.goal : ST().mode==='func' ? curLevel.goal : curLevel.goal;
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffled(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

/* ═══════════ 라운드 생성 ═══════════ */
function newRound(){
    const st=ST(), lv=curLevel;
    pointer=0; built=[]; wrongThisRound=false; repSel=null; repGot=0;

    if(st.mode==='index'){
        const [a,b]=lv.fill, n=a+Math.floor(Math.random()*(b-a+1));
        recipe=[{item:BREAD}];
        for(let i=0;i<n;i++) recipe.push({item:pick(FILLINGS)});
        recipe.push({item:BREAD});
        layoutBelt(lv.belt, recipe.map(r=>r.item));
    }
    if(st.mode==='loop'){
        const [rmin,rmax]=lv.rep, rn=rmin+Math.floor(Math.random()*(rmax-rmin+1));
        const main=pick(FILLINGS);
        recipe=[{item:BREAD},{item:main,n:rn}];
        if(lv.cond){
            let a=pick(FILLINGS.filter(x=>x!==main)), b=pick(FILLINGS.filter(x=>x!==a&&x!==main));
            const s=Math.random()<0.5?0:1+Math.floor(Math.random()*4);
            recipe.push({item:a,alt:b,stock:s});
        }
        recipe.push({item:BREAD});
        const must=[BREAD,main]; recipe.forEach(r=>{ if(r.alt){ must.push(r.item,r.alt); } });
        layoutBelt(lv.belt, must);
        stockMap={}; belt.forEach(x=>{ if(x) stockMap[x]=1+Math.floor(Math.random()*5); });
        recipe.forEach(r=>{ if(r.alt){ stockMap[r.item]=r.stock; if(r.stock===0) stockMap[r.alt]=Math.max(1,stockMap[r.alt]||1); } });
    }
    if(st.mode==='grid'){
        custGrid=[]; for(let r=0;r<lv.rows;r++){ const row=[]; for(let c=0;c<lv.cols;c++) row.push(pick(CUSTOMERS)); custGrid.push(row); }
        const all=[]; for(let r=0;r<lv.rows;r++) for(let c=0;c<lv.cols;c++) all.push([r,c]);
        const targets=shuffled(all).slice(0,lv.goal);
        gridOrders=targets.map(([r,c])=>({r:r,c:c,food:pick(FOODS)}));
        gridStep=0; gridPhase='pick'; heldFood=null; pendingRow=-1;
        const nn=Math.max(lv.shelf||6, gridOrders.length);
        passList=new Array(nn).fill(null);
        const spots=shuffled([...Array(nn).keys()]);
        gridOrders.forEach((o,i)=>{ passList[spots[i]]=o.food; });
        for(let i=0;i<nn;i++) if(passList[i]===null) passList[i]=pick(FOODS);
        passInit=passList.slice();
        gridTargets=targets; gridData=custGrid;
        recipe=gridOrders.map(o=>({item:o.food,rc:[o.r,o.c]}));
    }
    if(st.mode==='func'){
        fnPhase='def'; fnSlot=0; fnServed=[]; fnBody=[];
        const n=lv.body, slot=1+Math.floor(Math.random()*(n-1));
        const tpl=[]; for(let i=0;i<n;i++) tpl.push(i===0||i===n-1 ? BREAD : pick(FILLINGS));
        tpl[slot]='◆';
        recipe=tpl.map(x=>({item:x}));
        fnArgs=shuffled(FILLINGS).slice(0,lv.goal);
        layoutBelt(lv.belt, tpl.filter(x=>x!=='◆').concat(fnArgs));
    }
    if(st.mode==='chefs'){
        chefRoster=shuffled(CHEF_TYPES).slice(0,lv.chefs);
        let pool=[]; while(pool.length<lv.goal) pool=pool.concat(shuffled(chefRoster));

}
function callChef(i){ callChefN(i, chefOrders[chefStep] ? chefOrders[chefStep].n : 1); }
function callChefN(i, cnt){
    if(!canAct()||ST().mode!=='chefs') return;
    const chef=chefRoster[i], order=chefOrders[chefStep], hasPr=!!curLevel.pr;
    if(!chef||!order) return;
    if(chef.name===order.name && (!hasPr || cnt===order.n)){
        const ncnt=order.n;
        snd('ok'); combo++; if(combo>maxCombo)maxCombo=combo; flash('slot-'+i,true);
        const callCode = hasPr ? `${chef.name}(${ncnt})` : `${chef.name}()`;
        $('codeline').innerHTML=hi(callCode)+`<span style="color:#8C8B85;margin-left:14px"># 조리 중...</span>`;
        $('echo').innerHTML=hi(callCode);
        // ── 애니메이션: 조리 → 배달 → 전달 → 복귀 ──
        animating=true; pauseTimer();
        const spr=$('chefspr-'+i), bub=$('chefbub-'+i), rec=chef.recipe;
        spr.classList.add('cooking'); bub.style.display='block'; bub.textContent='';
        let k=0;
        const tk0=animToken;
        const iv=setInterval(()=>{
            if(tk0!==animToken||screen!=='game'){ clearInterval(iv); return; }
            if(k<rec.length){ bub.textContent+=em(rec[k]); snd('tick'); k++; }
            else { clearInterval(iv); bub.textContent='🍔'.repeat(ncnt); snd('ok'); }
        },150);
        const cookMs=150*(rec.length+1)+300;
        const tk=animToken;
        setTimeout(()=>{ if(tk!==animToken||screen!=='game')return;
            spr.classList.remove('cooking'); spr.style.zIndex='9'; spr.style.bottom='12px';
            const nmEl=spr.querySelector('.chefnm'); if(nmEl) nmEl.style.opacity='0';
            const mcEl=$('kitchen').querySelector('.mainchef'), spW=spr.offsetWidth||84;
            const targetLeft=mcEl.offsetLeft-spW+30;   // 메인셰프 코앞, 살짝 겹칠 만큼
            spr.style.transform=`translateX(${targetLeft-spr.offsetLeft}px)`;
        },cookMs);
        setTimeout(()=>{ if(tk!==animToken||screen!=='game')return;
            flyEl('chefbub-'+i,'passfood','🍔');
            bub.style.display='none'; snd('done');
            const pf=$('passfood'); if(pf) pf.textContent='🍔'.repeat(Math.min(servedBurgers+ncnt,12));
            const mb=$('mainbub'); mb.style.display='block'; mb.textContent=`🍔${ncnt>1?'×'+ncnt:''} 접수! 감사~`;
        },cookMs+650);
        setTimeout(()=>{ if(tk!==animToken||screen!=='game')return;
            spr.style.transform=''; spr.style.zIndex='';
            const nmEl2=spr.querySelector('.chefnm'); if(nmEl2) nmEl2.style.opacity='';
            const mb=$('mainbub'); if(mb) mb.style.display='none';
            $('codeline').innerHTML = hasPr
                ? hi(`완성 = ${chef.name}(${ncnt})`)+`<span style="color:#8C8B85;margin-left:14px"># return '🍔' * ${ncnt} → ${'🍔'.repeat(ncnt)}</span>`
                : hi(`${chef.name}()`)+`<span style="color:#8C8B85;margin-left:14px"># [${rec.map(x=>`'${nm(x)}'`).join(', ')}] 완성!</span>`;
            servedBurgers+=ncnt;
            chefStep++; doneCount=chefStep; animating=false;
            if(chefStep>=chefOrders.length){ onRoundComplete(); return; }
            resumeTimer(); renderGame();
        },cookMs+1350);
    } else if(chef.name!==order.name){
        flash('slot-'+i,false); penalty();
        plog('오답', `함수호출: ${chef.name} 호출 — 주문은 ${order.name}`);
        $('echo').innerHTML=`<span style="color:var(--red)">${chef.name} 셰프는 ${chef.recipe.map(em).join('')} 담당 — 주문은 <b>${order.name}</b>이에요!</span>`;
    } else {
        flash('slot-'+i,false); penalty();
        plog('오답', `매개변수: ${chef.name}(${cnt}) — 주문은 ${order.n}개`);
        $('echo').innerHTML=`<span style="color:var(--red)">괄호 안 숫자는 <b>개수(매개변수)</b>! 주문은 <b>${order.n}개</b>예요</span>`;
        renderGame();
    }
}

let justAdded=0;
/* 재료가 벨트 칸 → 코드줄(my_burger)로 날아가는 연출 */
function flyToCode(fromId, emoji){
    const f=$(fromId), t=$('codeline');
    if(!f||!t||!t.offsetParent) return;
    const a=f.getBoundingClientRect(), b=t.getBoundingClientRect();
    const s=document.createElement('span'); s.className='fly-emoji'; s.textContent=emoji;
    const x0=a.left+a.width/2-13, y0=a.top+a.height/2-13;
    s.style.left=x0+'px'; s.style.top=y0+'px';
    document.body.appendChild(s);
    requestAnimationFrame(()=>{
        s.style.transform=`translate(${b.left+40-x0}px, ${b.top+b.height/2-13-y0}px) scale(.45)`;
        s.style.opacity='0.15';
    });
    setTimeout(()=>s.remove(),620);
}
function canAct(){ return screen==='game' && !previewing && !inputLock && !animating && running; }
function flash(id, ok){
    const el=$(id); if(!el) return;
    el.classList.remove(ok?'wrong':'correct'); void el.offsetWidth; el.classList.add(ok?'correct':'wrong');
}
function penalty(){
    snd('bad'); combo=0; wrongThisRound=true; levelWrong=true; updateCombo();
    setLock(true); clearTimeout(lockTimer); lockTimer=setTimeout(()=>setLock(false),LOCK_MS);
}
function tapRep(n){ if(!canAct()) return; repSel = repSel===n ? null : n; renderGame(); }
function tapParam(){
    if(!canAct() || ST().mode!=='func' || fnPhase!=='def') return;
    if(recipe[fnSlot].item==='◆'){ snd('ok'); combo++; if(combo>maxCombo)maxCombo=combo;
        fnBody.push('◆'); fnSlot++; afterFuncDef(); }
    else penalty();
}
function afterFuncDef(){
    if(fnSlot>=recipe.length){ fnPhase='call'; $('echo').innerHTML='<span style="color:var(--green-d)">레시피 등록 완료! 이제 주문을 처리하세요</span>'; }
    renderGame();
}
function grab(i){
    if(!canAct()) return;
    const st=ST(), item=belt[i];
    if(item===null||item===undefined) return;

    if(st.mode==='func'){
        if(fnPhase==='def'){
            const want=recipe[fnSlot].item;
            if(want==='◆'){ flash('slot-'+i,false); penalty(); return; }
            if(item===want){ snd('ok'); combo++; if(combo>maxCombo)maxCombo=combo; flash('slot-'+i,true);
                fnBody.push(item); fnSlot++; $('echo').innerHTML=hi(`재료 ${fnSlot}칸 등록`); afterFuncDef(); }
            else { flash('slot-'+i,false); penalty(); }
            return;
        }
        const arg=fnArgs[fnServed.length];
        if(item===arg){
            snd('ok'); combo++; if(combo>maxCombo)maxCombo=combo; flash('slot-'+i,true);
            flyToCode('slot-'+i, em(arg));
            fnServed.push(recipe.map(r=>r.item==='◆'?arg:r.item));
            doneCount=fnServed.length;
            $('echo').innerHTML=hi(`make_burger('${nm(arg)}')`);
            if(fnServed.length>=fnArgs.length){ onRoundComplete(); return; }
            renderGame();
        } else { flash('slot-'+i,false); penalty(); }
        return;
    }

    if(pointer>=recipe.length) return;
    const cur=recipe[pointer];

    if(st.mode==='loop'){
        const need = cur.alt ? ((stockMap[cur.item]||0)>0 ? cur.item : cur.alt) : cur.item;
        const times = cur.n||1;
        if(item!==need){ flash('slot-'+i,false); penalty(); return; }
        // 잘못된 배수 칩을 골라둔 경우만 오답 (칩 없이 하나씩 넣는 건 OK!)
        if(times>1 && repSel && repSel!==times){
            flash('slot-'+i,false); penalty();
            $('echo').innerHTML=`<span style="color:var(--red)">반복 횟수가 달라요! 레시피는 ×${times}</span>`;
            return;
        }
        snd('ok'); combo++; if(combo>maxCombo)maxCombo=combo; flash('slot-'+i,true);
        const add = (times>1 && repSel===times) ? (times-repGot) : 1; // 칩=남은 만큼 한 번에, 없으면 1장씩
        justAdded=add; flyToCode('slot-'+i, em(need));
        for(let k=0;k<add;k++) built.push(need);
        repGot+=add;
        if(times>1){
            $('echo').innerHTML = (add>1)
                ? hi(`for i in range(${times}): append('${nm(need)}')`)
                : hi(`append('${nm(need)}')`)+`<span style="color:var(--greytext);font-weight:700"> ${repGot}/${times}${repGot<times?` · ×${times} 칩이면 한 번에!`:''}</span>`;
        } else {
            $('echo').innerHTML = hi(cur.alt ? `${nm(cur.item)}재고 = ${stockMap[cur.item]||0} → append('${nm(need)}')` : `append('${nm(need)}')`);
        }
        repSel=null;
        if(repGot>=times){ repGot=0; pointer++; }
        if(pointer>=recipe.length){ onRoundComplete(); return; }
        renderGame(); return;
    }

    // index 모드
    if(item===cur.item){
        snd('ok'); combo++; if(combo>maxCombo)maxCombo=combo; flash('slot-'+i,true);
        justAdded=1; flyToCode('slot-'+i, em(item));
        built.push(item); belt[i]=null; pointer++;
        $('echo').innerHTML=hi(`재료[${i}] → '${nm(item)}'`);
        if(pointer>=recipe.length){ onRoundComplete(); return; }
        ensureNeeded(); renderGame();
    } else {
        flash('slot-'+i,false); penalty();
        plog('오답', `인덱싱: 재료[${i}](${nm(item)}) 선택 — 필요한 건 ${nm(cur.item)}`);
        $('echo').innerHTML=hi(`재료[${i}]`)+` 는 <b>'${nm(item)}'</b> — 지금 필요한 건 <b style="color:var(--blue-d)">'${nm(cur.item)}'</b>! 0부터 다시 세어 보세요`;
    }
}
function ensureNeeded(){
    if(pointer>=recipe.length) return;
    const need=recipe[pointer].item;
    if(!belt.includes(need)){
        const e=belt.indexOf(null);
        belt[e>=0?e:Math.floor(Math.random()*belt.length)]=need;
    }
}

function onRoundComplete(){
    const st=ST();
    if(st.mode==='grid'||st.mode==='func'||st.mode==='chefs'){ onLevelClear(); return; }
    stopTimer(); snd('done'); doneCount++;
    let healed=false;
    if(!wrongThisRound && hearts<3){ hearts++; healed=true; }
    renderGame();
    $('echo').innerHTML = healed ? '<span style="color:var(--red)">퍼펙트! ❤️ 하트 회복!</span>' : '🍔 버거 완성!';
    plog('버거완성', `${doneCount}/${goalOf()}${wrongThisRound?'':' (무실수)'}`);
    if(doneCount>=goalOf()){ setTimeout(onLevelClear,500); return; }
    // 코드 읽기 찬스: 레벨당 1회, 방금 만든 my_burger 코드를 읽어야 풀 수 있는 보너스
    if(ST().mode==='index' && !bonusAsked && built.length>=2){
        bonusAsked=true;
        setTimeout(()=>{ if(screen==='game') showBonus(); },650);
        return;
    }
    setTimeout(()=>{ if(screen!=='game')return; newRound(); beginRound(); },600);
}

function showBonus(){
    const names=built.map(nm);
    const k=Math.floor(Math.random()*names.length);
    const answer=names[k];
    let opts=shuffled([...new Set(names)]).slice(0,3);
    if(!opts.includes(answer)){ opts[0]=answer; opts=shuffled(opts); }
    bonusActive={k,answer,opts};
    ovNext='bonus-skip';
    const code=`my_burger = [${names.map(x=>`'${x}'`).join(', ')}]\nprint(my_burger[${k}])`;
    showOverlay('🧐','코드 읽기 찬스!','',
        `<div class="codeblock" style="text-align:left;margin:4px 0 2px">${hi(code)}</div>`+
        `<div class="bonus-opts">${opts.map((o,oi)=>`<button class="opt" onclick="bonusPick(${oi})"><span class="lt">${oi+1}</span>${esc(o)}</button>`).join('')}</div>`,
        `방금 만든 버거의 코드예요! 무엇이 출력될까요? (숫자키 1~${opts.length}) · 맞히면 다음 주문 ⏱ +3초`,'건너뛰기');
}

    ovNext='bonus-continue';

    if(ovNext==='bonus-skip'||ovNext==='bonus-continue'){
        bonusActive=null;
        if(screen==='game'){ newRound(); beginRound(); } else showMap();
        return;
    }
    if(ovNext==='next') startLevel(li+1);
    else if(ovNext==='retry') startLevel(li,true);
    else if(ovNext==='quiz'){ retry=false; startQuiz(); }
    else if(ovNext==='corrective'){ learnRetry=true; learnIdx=0; showLearn(); }
    else if(ovNext==='nextstage'){ si=Math.min(si+1,STAGES.length-1); retry=false; learnRetry=false; learnIdx=0; showLearn(); }
    else showMap();
}

/* ═══════════ 확인 문제 (형성평가) ═══════════ */
function startQuiz(){
    stopTimer(); screen='quiz'; only('quiz-screen');
    qi=0; qc=0; qPick=null; qOrder=[]; qLocked=false; qShuf=null; qPendingRow=-1;
    qSet=buildQuizSet();
    plog('확인문제시작', retry?'대체 문항(재평가)':'1차 평가');
    renderQuiz();
}
const qNorm = s => String(s).replace(/\s+/g,'');
function qRight(q){
    if(q.type==='order') return qOrder.join('|')===q.blocks.join('|');
    if(q.type==='grid') return Array.isArray(qPick)&&qPick[0]===q.a[0]&&qPick[1]===q.a[1];
    if(q.type==='input') return qPick!==null && (q.accept||[q.a]).some(x=>qNorm(x)===qNorm(qPick));
    return qPick===q.a;
}
function renderQuiz(){
    const qs=QS(), q=qs[qi];
    $('qbar-i').style.width=((qi/qs.length)*100)+'%';
    $('qcount').innerText=`${qi+1}/${qs.length}`;
    let body='';
    if(q.type==='mc'){
        body=q.opts.map((o,i)=>{
            let c='opt'; if(qLocked){ if(i===q.a)c+=' ok'; else if(i===qPick)c+=' no'; } else if(qPick===i)c+=' pick';
            return `<button class="${c}" onclick="qp(${i})"><span class="lt">${i+1}</span>${esc(o)}</button>`;
        }).join('');
    }
    if(q.type==='cell'){
        body=`<div class="qcells" style="grid-template-columns:repeat(${Math.min(q.cells.length,5)},1fr)">`+
            q.cells.map((v,i)=>{
                let c='qcell'; if(qLocked){ if(i===q.a)c+=' ok'; else if(i===qPick)c+=' no'; } else if(qPick===i)c+=' pick';
                return `<button class="${c}" onclick="qp(${i})"><b>[${i}]</b><div style="font-size:22px">${em(v)}</div>${nm(v)}</button>`;
            }).join('')+`</div>`;
    }
    if(q.type==='grid'){
        const cols=q.grid[0].length;
        body=`<div class="qcells" style="grid-template-columns:30px repeat(${cols},1fr)">`+
            q.grid.map((row,r)=>`<div class="rowtag" style="border-radius:10px">[${r}]</div>`+
                row.map((v,c)=>{
                    let cl='qcell';
                    const isA=q.a[0]===r&&q.a[1]===c, isP=Array.isArray(qPick)&&qPick[0]===r&&qPick[1]===c;
                    if(qLocked){ if(isA)cl+=' ok'; else if(isP)cl+=' no'; } else { if(isP)cl+=' pick'; if(qPendingRow===r)cl+=' pick'; }
                    return `<button class="${cl}" onclick="qpc(${r},${c})"><b>[${r}][${c}]</b><div style="font-size:20px">${em(v)}</div>${nm(v)}</button>`;
                }).join('')).join('')+`</div>`;
    }
    if(q.type==='order'){
        const key=`${si}-${retry}-${qi}`;
        if(!qShuf||qShuf.key!==key) qShuf={key,arr:shuffled(q.blocks)};
        body=qShuf.arr.map((b,bi)=>{
            const n=qOrder.indexOf(b);
            return `<button class="opt ${n>=0?'pick':''}" onclick="qpoIdx(${bi})"><span class="lt">${n>=0?n+1:('<i style="color:var(--grey-d);font-style:normal">'+(bi+1)+'</i>')}</span>${esc(b)}</button>`;
        }).join('') + (qOrder.length?`<button onclick="qOrder=[];renderQuiz()" style="background:none;border:none;color:var(--greytext);font-family:inherit;font-weight:600;font-size:13px;text-decoration:underline;cursor:pointer;margin:2px 4px">순서 지우기</button>`:'');
    }
    if(q.type==='input'){
        body=`<input id="qinput" class="qinput" type="text" autocomplete="off" spellcheck="false" placeholder="${esc(q.ph||'정답을 직접 입력하세요')}" value="${qPick===null?'':esc(qPick).replace(/"/g,'&quot;')}" oninput="qPick=this.value.trim()||null" ${qLocked?'disabled':''}>`
            + (qLocked?`<div class="qans">정답: <b class="mono">${esc(q.a)}</b></div>`:'');
    }
    let keyhelp='';
    if(q.type==='mc') keyhelp=`숫자 1~${q.opts.length} 로 선택 → Enter 확인`;
    else if(q.type==='cell') keyhelp=`번호키 0~${q.cells.length-1} 로 칸 선택 → Enter 확인`;
    else if(q.type==='order') keyhelp=`숫자를 실행 순서대로 입력 (1~${q.blocks.length}) → Enter 확인`;
    else if(q.type==='grid') keyhelp= qPendingRow>=0?`행 [${qPendingRow}] 선택됨 → 열 번호 입력!`:`행 번호 → 열 번호 입력 → Enter 확인`;
    else if(q.type==='input') keyhelp=`✍️ 직접 쓰기 — 코드(또는 답)를 입력하고 Enter`;
    const ok=qLocked&&qRight(q);
    const ready = q.type==='order' ? qOrder.length===q.blocks.length : qPick!==null;
    $('quiz-body').innerHTML=`
        <div style="display:flex;align-items:center;gap:8px;margin:6px 2px 0">
            <span class="lvl-tag" style="background:${retry?'var(--purple-l)':'var(--blue-l)'};color:${retry?'var(--purple-d)':'var(--blue-d)'}">
                ${retry?'다시 확인':'확인 문제'} · ${ST().name}</span>
            <span style="font-weight:700;font-size:13px;color:var(--greytext)">맞힌 개수 ${qc}</span></div>
        <div style="font-size:12px;font-weight:600;color:var(--greytext);margin:8px 2px 0">⌨️ ${keyhelp}</div>
        <h2>${q.q}</h2>
        ${q.code?`<div class="codeblock">${hi(q.code)}</div>`:''}
        ${body}
        ${qLocked?`<div class="fbbar ${ok?'ok':'no'}"><h4>${ok?'✅ 정확해요!':'❌ 다시 볼까요'}</h4><p>${q.why}</p>
            <button class="btn ${ok?'':'red'}" style="width:100%" onclick="qNext()">${qi===qs.length-1?'채점 결과 보기':'계속'} ⏎</button></div>`
        :`<button class="btn" style="width:100%;margin-top:10px" ${(ready||q.type==='input')?'':'disabled'} onclick="qSubmit()">${(ready||q.type==='input')?'확인 ⏎':'답을 고르세요'}</button>`}`;
    if(qLocked) window.scrollTo(0,document.body.scrollHeight);
    const qin=$('qinput'); if(qin && !qLocked) setTimeout(()=>qin.focus(),0);
}
function qp(i){ if(qLocked)return; qPick=i; renderQuiz(); }
function qpc(r,c){ if(qLocked)return; qPendingRow=-1; qPick=[r,c]; renderQuiz(); }
function qpo(b){ if(qLocked)return; const i=qOrder.indexOf(b); if(i>=0)qOrder.splice(i,1); else qOrder.push(b); renderQuiz(); }
function qpoIdx(i){ if(qShuf&&qShuf.arr[i]!==undefined) qpo(qShuf.arr[i]); }
function qSubmit(){
    const q=QS()[qi];
    if(q.type==='input' && (qPick===null||!String(qPick).trim())) return;
    qLocked=true;
    const right=qRight(q);
    if(right){ qc++; snd('ok'); } else { prog[si].wrong++; snd('bad'); }
    plog('문항', `${retry?'재평가':'1차'} Q${qi+1} [${q.type}] ${right?'정답':'오답'}${right?'':' — '+String(q.q).slice(0,30)}`);
    renderQuiz();
}
function qNext(){
    const qs=QS();
    if(qi===qs.length-1){
        const rate=qc/qs.length, p=prog[si];
        p.attempts++; p.best=Math.max(p.best,rate);
        if(rate>=PASS) p.passed=true;
        saveProgress();
        plog('평가결과', `${Math.round(rate*100)}% (${qc}/${qs.length}) ${rate>=PASS?'통과':'미달'} · ${p.attempts}번째 도전`);
        verdict(rate);
    } else { qi++; qPick=null; qOrder=[]; qLocked=false; qPendingRow=-1; renderQuiz(); window.scrollTo(0,0); }
}
function verdict(rate){
    const pct=Math.round(rate*100), pass=rate>=PASS, p=prog[si], last=si===STAGES.length-1;
    if(pass){ snd('star'); confetti(); } else snd('bad');
    ovNext = pass ? (last?'map':'nextstage') : 'corrective';
    const bar=`<div class="meterbar"><i style="width:${pct}%;background:${pass?'var(--green)':'var(--red)'}"></i></div>
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--greytext)">
        <span>${qc}/${QS().length} 정답 · ${pct}%</span><span>통과 기준 80%</span></div>
        <div style="font-size:12px;color:var(--greytext);font-weight:600;margin-top:8px">
        도전 ${p.attempts}번 · 최고 ${Math.round(p.best*100)}%${p.attempts>=3&&!pass?'<br>막히면 선생님이나 짝에게 물어봐도 좋아요!':''}</div>`;
    showOverlay(pass?'🎓':'🔁', pass?`${ST().name} 통과!`:'조금만 더!',
        pass?'★★★':'☆☆☆', bar,
        pass ? (last?'네 주방을 모두 마스터했어요! 🏆':'다음 주방으로 가 볼까요?')
             : '틀린 부분만 짧게 다시 보고, 다른 문제로 한 번 더 확인해요.',
        pass ? (last?'맵으로':'다음 주방') : '다시 배우기',
        pass?'':' purple');
}

/* ═══════════ 키보드 · 콘페티 ═══════════ */
window.addEventListener('keydown',e=>{
    // ── Enter: 진행/확인 ──
    if(e.key==='Enter'){
        if($('overlay').classList.contains('show')){ overlayAction(); return; }
        if(screen==='learn'){
            const bs=document.querySelectorAll('#learn-body .btnrow .btn');
            if(bs.length) bs[bs.length-1].click();
            return;
        }
        if(screen==='quiz'){
            if(qLocked){ qNext(); }
            else{
                const q=QS()[qi];
                const ready = q.type==='order' ? qOrder.length===q.blocks.length : qPick!==null;
                if(ready) qSubmit();
            }
            return;
        }
        return;
    }
    if(e.key==='Escape'){
        if(screen==='game'){ quitToMap(); }
        else if(screen==='learn'||screen==='quiz'){ showMap(); }
        return;
    }
    if(!(e.key>='0'&&e.key<='9')) return;
    const n=parseInt(e.key);
    // ── 오버레이: 보너스 선택지(1~3) · 연습 모드 버튼(0) ──
    if($('overlay').classList.contains('show')){
        if(bonusActive && n>=1 && n<=bonusActive.opts.length) bonusPick(n-1);
        else if(n===0){ const pb=$('ov-practice'); if(pb) pb.click(); }
        return;
    }
    // ── 학습카드: 0 = 이전/나가기 ──
    if(screen==='learn'){
        if(n===0){ const bs=document.querySelectorAll('#learn-body .btnrow .btn'); if(bs.length) bs[0].click(); }
        return;
    }
    // ── 맵: 1~3 = 차시 시작 ──
    if(screen==='map'){ if(n>=1&&n<=STAGES.length) tapStage(n-1); return; }
    // ── 퀴즈: 유형별 숫자 입력 ──
    if(screen==='quiz'){
        if(qLocked) return;
        const q=QS()[qi];
        if(q.type==='input') return;   // 입력형: 숫자도 입력창으로
        if(q.type==='mc'){ if(n>=1&&n<=q.opts.length) qp(n-1); }
        else if(q.type==='cell'){ if(n<q.cells.length) qp(n); }
        else if(q.type==='order'){ if(qShuf&&n>=1&&n<=qShuf.arr.length) qpo(qShuf.arr[n-1]); }
        else if(q.type==='grid'){
            const rows=q.grid.length, cols=q.grid[0].length;
            if(qPendingRow<0){ if(n<rows){ qPendingRow=n; renderQuiz(); } }
            else{ const r0=qPendingRow; qPendingRow=-1; if(n<cols) qpc(r0,n); else renderQuiz(); }
        }
        return;
    }
    // ── 게임 ──
    if(screen!=='game') return;
    const st=ST();
    if(st.mode==='chefs'){
        if(!curLevel.pr){ callChef(n); return; }           // Lv.1: 셰프 번호 = 바로 호출
        if(!canAct()) return;
        if(pendingChef<0){                                  // ① 셰프 선택
            if(chefRoster[n]){ pendingChef=n; renderGame(); }
            return;
        }
        if(n===0){ pendingChef=-1; renderGame(); return; }  // 0 = 선택 취소
        const ci=pendingChef; pendingChef=-1;               // ② 개수(매개변수) 입력
        callChefN(ci, n);
        if(screen==='game' && !animating) renderGame();
        return;
    }
    if(st.mode==='grid'){
        if(gridPhase==='pick'){ pickFood(n); }
        else if(pendingRow<0){ if(custGrid[n]!==undefined){ pendingRow=n; renderGame(); } }
        else { const r0=pendingRow; pendingRow=-1; if(custGrid[r0]&&custGrid[r0][n]!==undefined) serveTable(r0,n); else renderGame(); }
        return;
    }
    grab(n);
});
function confetti(){
    const c=$('confetti'); if(!c)return; c.innerHTML='';
    const em=['🎉','⭐','🍔','🎊','🌟','❤️'];
    for(let i=0;i<26;i++){
        const s=document.createElement('span'); s.className='confetti-piece'; s.textContent=em[i%em.length];
        s.style.left=(Math.random()*100)+'%'; s.style.animationDelay=(Math.random()*.5)+'s';
        s.style.fontSize=(16+Math.random()*20)+'px'; c.appendChild(s);
    }
    setTimeout(()=>{c.innerHTML='';},2400);
}


/* ═══════════ BGM (Web Audio 루프) ═══════════ */
let bgmOn=true; try{ bgmOn=localStorage.getItem('pd_bgm')!=='off'; }catch(e){}
let bgmStarted=false, bgmGain=null, bgmTimer=null, bgmStep=0, bgmNext=0;
const BGM_STEP=0.21;
const BGM_MELODY=[329.63,392,523.25,392, 329.63,392,440,392,
 261.63,329.63,440,329.63, 261.63,329.63,392,329.63,
 220,261.63,349.23,261.63, 220,261.63,349.23,440,
 246.94,293.66,392,293.66, 246.94,293.66,392,493.88];
const BGM_BASS=[130.81,110,87.31,98];
function bgmTone(f,t,d,type,v){
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+d+0.02);
}
function bgmSchedule(){
    if(!actx||!bgmGain) return;
    const horizon=actx.currentTime+0.6;
    while(bgmNext<horizon){
        const m=BGM_MELODY[bgmStep%BGM_MELODY.length];
        if(m) bgmTone(m,bgmNext,0.19,'triangle',0.045);
        if(bgmStep%8===0) bgmTone(BGM_BASS[Math.floor(bgmStep/8)%BGM_BASS.length],bgmNext,0.8,'sine',0.07);
        bgmNext+=BGM_STEP; bgmStep++;
    }
}
function startBgm(){
    if(bgmStarted) return;
    try{
        if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
        if(actx.state==='suspended') actx.resume();
        bgmGain=actx.createGain(); bgmGain.gain.value=bgmOn?1:0; bgmGain.connect(actx.destination);
        bgmNext=actx.currentTime+0.1; bgmStarted=true;
        bgmTimer=setInterval(bgmSchedule,150);
    }catch(e){}
}
function toggleBgm(){
    bgmOn=!bgmOn;
    try{ localStorage.setItem('pd_bgm',bgmOn?'on':'off'); }catch(e){}
    if(bgmOn&&!bgmStarted) startBgm();
    if(bgmGain) bgmGain.gain.value=bgmOn?1:0;
    paintBgm();
}
function paintBgm(){ const b=document.getElementById('bgm-btn'); if(b) b.textContent=bgmOn?'🔊':'🔇'; }
function bgmGesture(){ if(bgmOn) startBgm(); window.removeEventListener('pointerdown',bgmGesture); window.removeEventListener('keydown',bgmGesture); }
window.addEventListener('pointerdown',bgmGesture);
window.addEventListener('keydown',bgmGesture);
paintBgm();

loadProgress();
showMap();
</script>
