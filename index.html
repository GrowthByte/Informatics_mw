<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 방 온습도 모니터링</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; text-align: center; padding: 20px; }
        /* 1. 그래프를 담는 컨테이너 크기를 대폭 키웠습니다 (max-width: 1200px) */
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        /* 2. 차트 캔버스의 높이를 고정하여 더 크게 보이도록 설정 */
        .chart-box { position: relative; width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌡️ 실시간 온·습도 모니터링</h2>
        <p id="status" style="color: gray;">데이터 가져오는 중...</p>
        <div class="chart-box">
            <canvas id="iotChart"></canvas>
        </div>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxw5KUsIFRA9y2mWmHtBsZCGl-lQ6p8GaMc2qVjzC5icsZ_2SIrWNjd2_tLjwYLclz6/exec"; 
        let myChart;

        async function updateChart() {
            try {
                const response = await fetch(scriptUrl);
                if (!response.ok) throw new Error("구글 서버 응답 없음");
                
                const rows = await response.json(); 
                
                if (rows.error) {
                    throw new Error(`구글 시트 에러: ${rows.error}`);
                }

                const allLabels = [], allTemps = [], allHumids = [];

                // 1. 우선 유효한 전체 데이터를 정제하여 배열에 넣습니다.
                rows.forEach((row, index) => {
                    if(row.length >= 3) { // 날짜, 온도, 습도 최소 3개 열이 필요하므로 안전하게 3으로 설정
                        const tempValue = parseFloat(row[1]); // B열: 온도
                        const humidValue = parseFloat(row[2]); // C열: 습도
                        
                        if (!isNaN(tempValue) && !isNaN(humidValue)) {
                            allLabels.push(`${index + 1}번`); 
                            allTemps.push(tempValue); 
                            allHumids.push(humidValue); 
                        }
                    }
                });

                if (allLabels.length === 0) {
                    throw new Error("구글 시트 내에 유효한 숫자 데이터가 비어있습니다.");
                }

                // 2. 🌟 최대 30개의 최근 데이터만 잘라내기 (과거 데이터는 자동 탈락)
                const maxDisplayCount = 30;
                let labels = allLabels;
                let temps = allTemps;
                let humids = allHumids;

                if (allLabels.length > maxDisplayCount) {
                    // 뒤에서부터 30개만 남기고 자릅니다.
                    labels = allLabels.slice(-maxDisplayCount);
                    temps = allTemps.slice(-maxDisplayCount);
                    humids = allHumids.slice(-maxDisplayCount);
                }

                // 3. 그래프 그리기 및 업데이트
                if (myChart) {
                    myChart.data.labels = labels;
                    myChart.data.datasets[0].data = temps;
                    myChart.data.datasets[1].data = humids;
                    myChart.update('none');
                } else {
                    const ctx = document.getElementById('iotChart').getContext('2d');
                    myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: '온도 (°C)', data: temps, borderColor: '#ff4d4d', backgroundColor: 'rgba(255, 77, 77, 0.1)', tension: 0.2, fill: false },
                                { label: '습도 (%)', data: humids, borderColor: '#3399ff', backgroundColor: 'rgba(51, 153, 255, 0.1)', tension: 0.2, fill: false }
                            ]
                        },
                        options: { 
                            responsive: true,
                            maintainAspectRatio: false, // 캔버스 높이를 스타일 조절에 맞추기 위해 필수
                            scales: { 
                                x: { title: { display: true, text: '데이터 순서 (최신 30개)' } } 
                            }
                        }
                    });
                }
                document.getElementById('status').innerText = `최근 업데이트: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = `데이터 로드 실패 (${e.message})`;
            }
        }

        // 10초마다 확인
        setInterval(updateChart, 10000);
        updateChart();
    </script>
</body>
</html>
