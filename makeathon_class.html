<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메이커톤 분반 확인</title>
<style>
:root{--navy:#1B2440;--cy:#2FA8DC;--or:#F07A2B;--bg:#0f1530}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#fff;
background:radial-gradient(60vmax 60vmax at 0% 0%,rgba(47,168,220,.35),transparent 60%),radial-gradient(60vmax 60vmax at 100% 100%,rgba(240,122,43,.35),transparent 60%),var(--navy);
display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:420px}
.hd{text-align:center;margin-bottom:22px}
.hd img{width:96px;height:96px;background:#fff;border-radius:50%;padding:6px}
.hd .k{margin-top:12px;font-size:12px;letter-spacing:3px;color:#9fb2d9;font-weight:700}
.hd h1{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:4px;line-height:1.3}
.card{background:#fff;color:#111;border-radius:22px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
label{display:block;font-size:14px;font-weight:700;color:#444;margin:0 0 6px}
input{width:100%;font-size:18px;padding:14px 14px;border:2px solid #e3e6ee;border-radius:12px;outline:none;margin-bottom:16px;font-family:inherit}
input:focus{border-color:var(--cy)}
button{width:100%;font-size:18px;font-weight:800;padding:15px;border:0;border-radius:12px;background:var(--or);color:#fff;cursor:pointer;font-family:inherit}
button:active{transform:scale(.98)}
.hint{font-size:12.5px;color:#888;margin-top:12px;line-height:1.5;text-align:center}
.res{margin-top:18px;border-radius:16px;padding:20px;text-align:center;display:none}
.res.ok{display:block;background:#FFF4EC;border:2px solid var(--or)}
.res.no{display:block;background:#F4F5F8;color:#555;font-size:15px;line-height:1.6}
.res .nm{font-size:16px;font-weight:700;color:#333}
.res .ban{font-size:64px;font-weight:900;color:var(--or);line-height:1.1;margin:6px 0 2px;letter-spacing:-2px}
.res .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.res .pill{background:#fff;border:1px solid #f2d3bd;border-radius:30px;padding:6px 14px;font-size:14px;font-weight:700;color:#333}
.ft{text-align:center;font-size:12px;color:#9fb2d9;margin-top:18px;line-height:1.6}
</style></head><body>
